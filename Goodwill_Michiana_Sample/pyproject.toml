[project]
name = "goodwill-michiana-copilot-agent"
version = "0.1.0"
description = "Goodwill Michiana LangGraph baseline with Teams, Copilot Studio, Power BI, and MCP connectors"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
