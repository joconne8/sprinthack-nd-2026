name: Trusted synthetic data pipeline
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify schema regeneration
        run: |
          python3 contracts/build_schemas.py
          git diff --exit-code -- contracts/v1
      - name: Python syntax and task artifact checks
        run: |
          python3 -m compileall -q apps services goodwill_app contracts scripts tests
          python3 scripts/check_completion_artifacts.py
      - name: Contract, data and exact portal-file integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Existing acquisition tests
        run: python3 -m unittest discover -s acquisition/tests -p 'test_*.py' -v
      - name: Read-only fixture review
        run: python3 reports/DAT-01/review_fixtures.py
      - name: Fixture integrity and regeneration
        run: |
          python3 -m unittest discover -s goodwill/synthetic-data -p 'test_*.py' -v
          git diff --exit-code -- goodwill/synthetic-data
  client-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: tools/verification/package-lock.json
      - name: Install pinned verification tools
        run: npm ci --prefix tools/verification --ignore-scripts --no-audit --no-fund
      - name: Strict client build and boundary tests
        run: |
          node tools/verification/node_modules/typescript/bin/tsc --strict --target ES2020 --module commonjs --lib ES2020,DOM --outDir .runtime/client-test contracts/v1/client.ts
          node tests/client.test.cjs .runtime/client-test
      - name: Install separate browser runtime
        run: node tools/verification/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exact browser-file intake and API regression
        env:
          NODE_PATH: ${{ github.workspace }}/tools/verification/node_modules
        run: python3 scripts/verify_browser_handoff.py
      - name: Acquisition failure controls and actual dashboard flow
        run: |
          python3 scripts/verify_dashboard.py --acquisition-only
          python3 scripts/verify_dashboard.py
